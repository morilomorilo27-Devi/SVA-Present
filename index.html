const D=window.SVA_DATA,G=Object.fromEntries(D.groups.map(g=>[g.id,g])),stage=document.querySelector('#stage'),$=s=>document.querySelector(s);let idx=0,team=0,trace=0,docPage=0,zoom=1,panX=0,panY=0,returnPoint=null,docOverride=null;const pad=n=>String(n).padStart(2,'0');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const path=s=>encodeURI(s);const btn=(t,act)=>`<button onclick="${esc(act)}">${t}</button>`;const kicker=t=>`<div class="kicker">${t}</div>`;const note=t=>`<p class="note">${t}</p>`;const orbit=()=>`<svg class="orbit" viewBox="0 0 500 440" aria-label="تمثيل بصري لتكامل ست إدارات" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="gl"><stop stop-color="#c8af7a" stop-opacity=".28"/><stop offset="1" stop-color="#c8af7a" stop-opacity="0"/></radialGradient></defs><circle cx="250" cy="220" r="200" fill="url(#gl)"/><g fill="none" stroke="#668571" opacity=".4"><circle cx="250" cy="220" r="165"/><circle cx="250" cy="220" r="118"/><circle cx="250" cy="220" r="83" stroke-dasharray="2 8"/></g>${['المالية','الكنترول','شؤون الطلاب','شؤون العاملين','الإرشاد','الجودة'].map((n,i)=>{let a=(i*60-90)*Math.PI/180,x=250+165*Math.cos(a),y=220+165*Math.sin(a);return `<path class="line" d="M250 220 L${x} ${y}" stroke="#d2b47d" stroke-width="1.8"/><g transform="translate(${x} ${y})"><rect x="-54" y="-25" width="108" height="50" rx="4" fill="#1c3528" stroke="#91a58e"/><text y="-3" text-anchor="middle" font-size="11" fill="#d2b47d">${pad(i+1)}</text><text y="13" text-anchor="middle" font-size="12" fill="#f5f0e5">${n}</text></g>`}).join('')}<circle class="core" cx="250" cy="220" r="62" fill="#223b2b" stroke="#d2b47d" stroke-width="2"/><text x="250" y="217" font-size="31" font-weight="800" text-anchor="middle" fill="#f5f0e5">ERP</text><text x="250" y="239" font-size="11" text-anchor="middle" fill="#d2b47d">CENTRAL DATA</text></svg>`;
const scenes=[{title:'الافتتاحية',html:()=>`<div class="cover"><div>${kicker('SVA / BEYOND THE SYSTEM')}<h1>ست إدارات.<br><span class="gold">منظومة واحدة.</span></h1><div class="rule"></div><p>نظام معلومات متكامل لمعهد الوادي العالي بالعبور</p><p class="small">مشروع التخرج · عرض التحليل والتصميم</p></div>${orbit()}</div>`},{title:'فريق العمل',html:()=>`${kicker('01 / MEET THE MINDS')}<h2>الفريق وراء المنظومة.</h2><div class="team" id="teamCards">${D.team.map((p,i)=>`<div class="person ${p.role==='Team Leader'?'leader':''} ${i===team?'selected':''}" role="button" tabindex="0" aria-label="${p.ar}" onclick="selectTeam(${i})" onkeydown="if(event.key==='Enter')selectTeam(${i})">${p.role==='Team Leader'?'<div class="leader-badge">TEAM LEADER</div>':''}<img src="${path(p.src)}" alt="${p.ar}"><div class="num">${pad(i+1)}</div><div class="name">${p.name}<span class="role">${p.role}</span></div></div>`).join('')}</div><div class="controls">${btn('العضو التالي','selectTeam((team+1)%6)')}</div>`},{title:'المجال والمشكلة والحل',html:()=>`${kicker('02 / FROM FRAGMENTATION TO INTEGRATION')}<h2>من ملفات متفرقة إلى نظام متكامل.</h2><div class="split"><div class="before"><span class="tag">AS IS</span><div class="stack"><div class="sheet" style="--r:-12deg">EXCEL</div><div class="sheet" style="--r:8deg">ACCESS</div><div class="sheet" style="--r:-5deg">FILES</div></div><h3>المشكلة</h3><p>تعدد ملفات البيانات وإعادة إدخالها وتبادلها يدويًا بين الإدارات.</p></div><div class="after"><span class="tag">TO BE</span><div style="height:20vh;display:grid;place-items:center"><div style="border:1px solid #d2b47d;padding:3vh 4vw;font-size:clamp(28px,4vw,60px);letter-spacing:.12em;color:#d2b47d;font-weight:bold">ERP</div></div><h3>الحل المقترح</h3><p>تطبيق ويب عربي متكامل، قاعدة بيانات مركزية، صلاحيات حسب الدور وسجل تدقيق.</p></div></div><div class="note">Domain: قطاع التعليم العالي &nbsp; | &nbsp; Project Type: ERP Web System &nbsp; | &nbsp; المصدر: Wadi ERP، ص 2–3</div>`},{title:'معمارية التكامل',html:()=>`${kicker('03 / THE DIGITAL INSTITUTE')}<div class="split"><div><h2>مصدر واحد<br><span class="gold">للحقيقة.</span></h2><p>قاعدة بيانات مركزية موحدة تربط الإدارات الست، مع RBAC وAudit Log وتكامل لحظي.</p><div class="rule"></div>${btn('فتح معمارية التكامل الأصلية','openDoc("analysis",1)')}${btn('الأهداف التشغيلية حسب الإدارة','openDoc("analysis",3)')}</div>${orbit()}</div>${note('المصدر: Wadi ERP Presentation، ص 2. هذا الرسم تصور تقديمي لا يستبدل المخطط الأصلي.')}`},{title:'الأهداف القابلة للقياس',html:()=>`${kicker('04 / MEASURABLE OBJECTIVES')}<h2>أهداف قابلة للقياس والتحقق.</h2><div class="cards"><div class="panel"><div class="metric">0</div><h3>تكرار الإدخال</h3><p>بيانات الطالب أو الموظف بين الإدارات الست</p></div><div class="panel"><div class="metric">100%</div><h3>سجل التدقيق</h3><p>تغطية العمليات الحساسة</p></div><div class="panel"><div class="metric">100%</div><h3>تتبع الطلبات</h3><p>رقم مرجعي وحالة محدثة</p></div><div class="panel"><div class="metric">100%</div><h3>توازن القيود</h3><p>الإدارة المالية</p></div><div class="panel"><div class="metric">0</div><h3>تعارض القاعات</h3><p>الكنترول الامتحاني</p></div><div class="panel"><h3 class="gold">ترحيل آلي</h3><p>البيانات المعتمدة بين الإدارات دون تبادل ملفات يدوية.</p></div></div><div class="controls">${btn('الأهداف العامة الأصلية','openDoc("analysis",2)')}${btn('الأهداف التشغيلية كاملة','openDoc("analysis",3)')}</div>${note('معايير مستهدفة وليست نتائج قياس فعلية. المصدر: Wadi ERP Presentation، ص 3–5.')}`},{title:'التحليل الأولي والأدوار',group:'analysis',page:5},{title:'Use Case Diagram',group:'usecase',page:0},{title:'Context Diagram',group:'context',page:0},{title:'Level 1 DFD',group:'dfd',page:0},{title:'Chen ERD',group:'erd',page:0},{title:'Database Schema — 3NF',group:'schema',page:0},{title:'رحلة البيانات',html:()=>traceHTML()},{title:'المطالب الأكاديمية',html:()=>checkHTML()},{title:'الختام',html:()=>`${kicker('SVA / THE SYSTEM CONNECTED')}<div class="cover"><div><h1>من التحليل<br><span class="gold">إلى التصميم.</span></h1><p>نظام متكامل يدعم الربط بين الإدارات، ويستند إلى نماذج التحليل والتصميم المرفقة.</p><div class="rule"></div><h3>شكرًا لحسن الاستماع.</h3><div class="controls" style="margin-top:2vh">${btn('فتح وضع المناقشة','showDefense()')}${btn('جميع المصادر الأصلية','showSources()')}</div></div>${orbit()}</div>`}];
const traces=[{n:'القيد',d:'إدارة القبول وملفات الطلاب؛ حفظ وتحديث ملفات القيد والبيانات.',u:[1,'الطالب'],df:1,e:2,s:2},{n:'الرسوم',d:'إدارة الرسوم والتحصيل المالي؛ تسجيل الرسوم والمدفوعات والمنح.',u:[4,'المالية'],df:4,e:3,s:4},{n:'التسجيل',d:'تسجيل المقررات والجداول الدراسية؛ التحقق من المتطلبات والإخلاء المالي.',u:[1,'الطالب'],df:2,e:5,s:9},{n:'النتائج',d:'رصد الدرجات والنتائج والتخرج؛ حساب المعدل التراكمي.',u:[2,'عضو هيئة التدريس'],df:3,e:2,s:9},{n:'الاعتماد',d:'اعتماد النتائج وتوزيع الأعباء؛ سجل القرارات الأكاديمية والأعباء D5.',u:[5,'العمادة'],df:5},{n:'التقارير',d:'تقارير الوزارة والرقابة ودعم القرار؛ مستودع التقارير D6.',u:[6,'وزارة التعليم العالي'],df:6}];

function checkHTML(){return `${kicker('11 / ACADEMIC REQUIREMENTS')}<h2>مصفوفة التسليم.</h2><div class="matrix">${reqs.map((r,i)=>`<button ${r[1]===null?'class="missing" onclick="showMissing()"':`onclick="go(${Number(r[1])})"`}><b>${pad(i+1)}</b><span class="en">${r[0]}</span>${r[1]===null?' <span class="small">غير مرفق</span>':''}</button>`).join('')}</div><div class="controls">${btn('ملف المطلوب الأصلي — الصفحتان','openDoc("requirements",0)')}${btn('الأرشيف الكامل','showSources()')}</div>${note('Class Diagram وSequence Diagram مذكوران في المطلب 11، لكن لا يوجد ملف مستقل لهما ضمن المصادر المتاحة. لم تُنشأ بدائل غير معتمدة.')}`}
function current(){return docOverride||scenes[idx]}
function render(){let s=current();stage.innerHTML=s.group?docHTML(s.group):`<section class="scene">${s.html()}</section>`;$('#footerTitle').textContent=s.title;$('#chapter').textContent=s.group?G[s.group].title:'SVA / GRADUATION PROJECT';$('#count').textContent=pad(idx+1)+' / '+pad(scenes.length);$('#progress').style.width=((idx+1)/scenes.length*100)+'%';$('#prev').disabled=idx===0&&!docOverride;$('#next').disabled=idx===scenes.length-1&&!docOverride;$('#back').classList.toggle('hidden',!returnPoint);if(s.group)bindViewer();}
function go(n){idx=Math.max(0,Math.min(scenes.length-1,n));docOverride=null;returnPoint=null;docPage=scenes[idx].page||0;resetZoom();closeOverlay();render()}
function selectTeam(n){team=n;document.querySelectorAll('.person').forEach((p,i)=>p.classList.toggle('selected',i===n))}
function setTrace(n){trace=n;render()}
function resetZoom(){zoom=1;panX=panY=0}function setPage(n){let g=G[current().group];docPage=Math.max(0,Math.min(g.pages.length-1,n));resetZoom();render()}
function openDoc(id,p=0){if(!returnPoint)returnPoint={idx,docPage,docOverride};docOverride={title:G[id].title,group:id};docPage=p;resetZoom();closeOverlay();render()}
function back(){if(!returnPoint)return;let r=returnPoint;returnPoint=null;idx=r.idx;docPage=r.docPage;docOverride=r.docOverride;resetZoom();render()}
function docHTML(id){let g=G[id],p=g.pages[docPage];return `<section class="scene doc"><div class="dochead"><div><div class="kicker">SOURCE EXPLORER / ${id.toUpperCase()}</div><h2>${g.title}</h2></div><span class="index-num">${pad(docPage+1)} / ${pad(g.pages.length)}</span></div><div class="docbody"><div class="viewer" id="viewer"><img id="docImage" src="${path(p.src)}" alt="${esc(p.label)}"></div><aside class="sidebar">${g.pages.map((x,i)=>`<button class="${i===docPage?'active':''}" onclick="setPage(${i})"><span>${pad(i+1)}</span>${esc(x.label)}</button>`).join('')}</aside></div><div class="docfoot"><div class="controls">${btn('−','scaleZoom(-.35)')}${btn('+','scaleZoom(.35)')}${btn('ملاءمة','fitView()')}${btn('السابق','setPage(docPage-1)')}${btn('التالي','setPage(docPage+1)')}</div><span id="zoomLabel">100%</span><a href="${path(g.original||p.src)}" target="_blank" rel="noopener">فتح ${g.original?'PDF الأصلي':'الصورة الأصلية'} ↗</a></div></section>`}
function applyZoom(){let im=$('#docImage');if(im){im.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;$('#zoomLabel').textContent=Math.round(zoom*100)+'%'}}function scaleZoom(d){zoom=Math.max(1,Math.min(7,zoom+d));if(zoom===1)panX=panY=0;applyZoom()}function fitView(){resetZoom();applyZoom()}
function bindViewer(){let v=$('#viewer'),drag=null;v.addEventListener('wheel',e=>{e.preventDefault();scaleZoom(e.deltaY<0?.3:-.3)},{passive:false});v.addEventListener('dblclick',()=>zoom===1?scaleZoom(1):fitView());v.addEventListener('pointerdown',e=>{if(zoom===1)return;drag={x:e.clientX-panX,y:e.clientY-panY};v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{if(!drag)return;panX=e.clientX-drag.x;panY=e.clientY-drag.y;applyZoom()});v.addEventListener('pointerup',()=>drag=null);v.addEventListener('pointercancel',()=>drag=null)}
function showOverlay(html){$('#console').innerHTML=html;$('#overlay').hidden=false;$('#console').querySelector('button')?.focus()}function closeOverlay(){$('#overlay').hidden=true;$('#console').innerHTML=''}function head(t){return `<div class="console-head"><h2>${t}</h2>${btn('إغلاق ×','closeOverlay()')}</div>`}function showDefense(){showOverlay(head('Defense Console / فهرس المناقشة')+`<div class="console-grid">${scenes.map((s,i)=>`<button onclick="jumpScene(${i})"><b>${pad(i+1)}</b>${s.title}</button>`).join('')}</div><div class="rule"></div><div class="console-grid">${D.groups.map(g=>`<button onclick="openDoc('${g.id}',0)">${g.title} <span class="badge-count">${g.pages.length}</span></button>`).join('')}${btn('الأرشيف الكامل','showSources()')}${btn('الفيديو المرجعي','showVideo()')}</div>`)}
function jumpScene(i){go(i)}function showMissing(){showOverlay(head('المطلب 11 — UML')+`<p>المطلوب في الملف: Class Diagram وSequence Diagram. لا يوجد أي منهما كملف مرفق ضمن المصادر المتاحة؛ لم تتم إضافة محتوى غير موجود.</p><div class="rule"></div>${btn('عرض صفحة المطلوب الأصلية','openDoc("requirements",1)')}`)}
function showSources(){showOverlay(head('الأرشيف الأصلي / SOURCE LIBRARY')+`<p class="small">6 PDFs · 40 صفحة · 11 صورة Schema · 6 صور فريق · فيديو مرجعي واحد</p><div class="rule"></div><div class="sources">${D.groups.map(g=>g.original?`<div class="source-item"><strong>${esc(g.original.split('/').pop())}</strong><a href="${path(g.original)}" target="_blank">فتح الأصل (${g.pages.length} صفحات)</a>${btn('استعراض الصفحات',`openDoc('${g.id}',0)`)}</div>`:g.pages.map((p,i)=>`<div class="source-item"><strong>${esc(p.label)}</strong><a href="${path(p.src)}" target="_blank">الصورة الأصلية</a>${btn('استعراض',`openDoc('schema',${i})`)}</div>`).join('')).join('')}${D.team.map(p=>`<div class="source-item"><strong>${p.name}</strong><a href="${path(p.src)}" target="_blank">الصورة الأصلية</a></div>`).join('')}<div class="source-item"><strong>الفيديو المرجعي</strong>${btn('تشغيل الفيديو','showVideo()')}<a href="${path(D.video)}" target="_blank">فتح الأصل</a></div></div>`)}function showVideo(){showOverlay(head('الفيديو المرجعي لتقديم الفريق')+`<video class="video" src="${path(D.video)}" controls autoplay playsinline></video><p class="small">مرجع تصميمي فقط، وليس محتوى خاصًا بالفريق.</p>`)}function help(){showOverlay(head('مفاتيح التحكم')+`<p>← أو Space : التالي | → : السابق | F : ملء الشاشة | D : الفهرس | B : العودة للعرض | Home : البداية | Esc : إغلاق النافذة</p><p>داخل المخطط: عجلة الماوس للتكبير، سحب بعد التكبير، ضغط مزدوج للملاءمة، PgDown / PgUp للصفحات.</p>`)}
function next(){if(docOverride){let g=G[current().group];if(docPage<g.pages.length-1)setPage(docPage+1);else back()}else go(idx+1)}function prev(){if(docOverride){if(docPage>0)setPage(docPage-1);else back()}else go(idx-1)}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
$('#next').onclick=next;$('#prev').onclick=prev;$('#home').onclick=()=>go(0);$('#full').onclick=full;$('#defense').onclick=showDefense;$('#back').onclick=back;$('#help').onclick=help;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeOverlay()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay();return}if(!$('#overlay').hidden)return;if(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key))return;if(['ArrowLeft',' '].includes(e.key)){e.preventDefault();next()}else if(e.key==='ArrowRight')prev();else if(e.key.toLowerCase()==='f')full();else if(e.key.toLowerCase()==='d')showDefense();else if(e.key.toLowerCase()==='b')back();else if(e.key==='Home')go(0);else if(e.key==='PageDown'&&current().group)setPage(docPage+1);else if(e.key==='PageUp'&&current().group)setPage(docPage-1)});go(0);
</script></body></html>
